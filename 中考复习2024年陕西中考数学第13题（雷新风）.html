<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>初中数学课件-面积问题</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}
        body {display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#1a237e,#0d47a1);padding:20px;color:#fff;overflow-x:hidden}
        .container {width:100%;max-width:1400px;display:flex;flex-direction:column;gap:20px}
        .header {text-align:center;margin-bottom:20px;width:100%;}
        h1 {font-size:2rem;margin-bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,0.6);background:linear-gradient(to right,#ffd600,#ffab00);-webkit-background-clip:text;color:transparent;letter-spacing:1px}
        .geom-condition {font-size:1.1rem;font-weight:500;padding:12px 15px;background:rgba(255,255,255,0.1);border-radius:8px;border:2px solid rgba(100,255,218,0.4);box-shadow:0 3px 10px rgba(0,0,0,0.3);color:#64ffda;text-align:left;line-height:1.6;margin-bottom:20px;width:100%;}
        .btn-group {text-align:center;margin-bottom:20px}
        .auto-btn {padding:10px 20px;border:none;border-radius:6px;background:linear-gradient(to right,#ffd600,#ffab00);color:#1a237e;font-weight:bold;font-size:0.95rem;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,0.3)}
        .auto-btn:hover {opacity:0.9}
        
        .main {display:flex;gap:20px;width:100%;align-items:flex-start}
        .canvas-wrapper {
            flex:1;
            background:rgba(255,255,255,0.08);
            border-radius:12px;
            padding:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter:blur(8px);
            border:1px solid rgba(100,255,218,0.2);
            display:flex;
            flex-direction:column;
            gap:12px;
            min-height:400px;
        }
        
        .control-panel {
            width:350px;
            background:rgba(255,255,255,0.08);
            border-radius:12px;
            padding:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter:blur(8px);
            border:1px solid rgba(100,255,218,0.2);
            display:flex;
            flex-direction:column;
            gap:12px;
        }
        
        .control-panel h3 {
            margin:0 0 10px 0;
            font-size:18px;
            color:#64ffda;
            text-align:center;
            border-bottom:1px solid rgba(100,255,218,0.3);
            padding-bottom:10px;
        }
        
        #myCanvas {width:100%;height:400px;display:block;background:rgba(10,25,47,0.4);border-radius:8px;border:1px solid rgba(100,255,218,0.15);box-shadow:inset 0 0 15px rgba(0,0,0,0.4)}
        .slider-value {width:40px;text-align:center;color:#ffd600;font-weight:bold}
        .single-slider {display:flex;align-items:center;gap:10px;width:100%}
        .single-slider span {font-size:0.9rem;color:#fff;white-space:nowrap;display:inline-block;width:180px}
        .control-slider {flex:1;height:6px;background:rgba(255,255,255,0.2);border-radius:3px;outline:none;-webkit-appearance:none}
        .control-slider::-webkit-slider-thumb {-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#ffd600;cursor:pointer;border:2px solid #fff}
        .footer {text-align:center;opacity:0.9;width:100%;padding:15px 0;color:#e3f2fd;margin-top:15px}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2024年陕西中考数学第13题</h1>
            <div class="geom-condition">
                如图，在△ABC中，AB=AC，E是边AB上一点，连接CE，在BC右侧作BF//AC且BF=AE，连接CF。若AC=13，BC=10，则四边形EBFC的面积为 ______
            </div>
            <div class="btn-group">
                <button class="auto-btn" id="autoBtn">自动运动</button>
            </div>
        </div>
        
        <div class="main">
            <div class="canvas-wrapper">
                <canvas id="myCanvas"></canvas>
            </div>
            
            <div class="control-panel">
                <h3>控制参数</h3>
                <div class="single-slider">
                    <span>调整E/F点位置</span>
                    <input type="range" min="0" max="100" value="40" class="control-slider" id="efSlider">
                    <span class="slider-value" id="efValue">40%</span>
                </div>
                <div class="single-slider">
                    <span>绘制C点垂线</span>
                    <input type="range" min="0" max="100" value="0" class="control-slider" id="lineSlider">
                    <span class="slider-value" id="lineValue">0%</span>
                </div>
                <div class="single-slider">
                    <span>绘制A点高线</span>
                    <input type="range" min="0" max="100" value="0" class="control-slider" id="ahSlider">
                    <span class="slider-value" id="ahValue">0%</span>
                </div>
                <div class="single-slider">
                    <span>面积阴影转移</span>
                    <input type="range" min="0" max="100" value="0" class="control-slider" id="areaSlider">
                    <span class="slider-value" id="areaValue">0%</span>
                </div>
                <div class="single-slider">
                    <span>显示答案与解析</span>
                    <input type="range" min="0" max="100" value="0" class="control-slider" id="ansSlider">
                    <span class="slider-value" id="ansValue">0%</span>
                </div>
                <div class="single-slider">
                    <span>标签字号大小</span>
                    <input type="range" min="10" max="50" value="30" class="control-slider" id="labelSizeSlider">
                    <span class="slider-value" id="labelSizeValue">30px</span>
                </div>
                <div class="single-slider">
                    <span>题目文字大小</span>
                    <input type="range" min="12" max="50" value="20" class="control-slider" id="titleSizeSlider">
                    <span class="slider-value" id="titleSizeValue">20px</span>
                </div>
                <div class="single-slider">
                    <span>画布高度</span>
                    <input type="range" min="300" max="600" value="400" class="control-slider" id="canvasHeightSlider">
                    <span class="slider-value" id="canvasHeightValue">400px</span>
                </div>
                <div class="single-slider">
                    <span>网格显示</span>
                    <input type="range" min="0" max="100" value="0" class="control-slider" id="gridSlider">
                    <span class="slider-value" id="gridValue">0%</span>
                </div>
                <div class="single-slider">
                    <span>线条粗细</span>
                    <input type="range" min="1" max="10" value="3" class="control-slider" id="lineWidthSlider">
                    <span class="slider-value" id="lineWidthValue">3px</span>
                </div>
                <div class="single-slider">
                    <span>点大小</span>
                    <input type="range" min="2" max="15" value="5" class="control-slider" id="pointSizeSlider">
                    <span class="slider-value" id="pointSizeValue">5px</span>
                </div>
                <div class="single-slider">
                    <span>图形缩放</span>
                    <input type="range" min="50" max="200" value="100" class="control-slider" id="zoomSlider">
                    <span class="slider-value" id="zoomValue">100%</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">制作时间：2026.1.17，作者：雷新风</div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const efSlider = document.getElementById('efSlider'); 
        const lineSlider = document.getElementById('lineSlider');
        const ahSlider = document.getElementById('ahSlider');
        const areaSlider = document.getElementById('areaSlider');
        const ansSlider = document.getElementById('ansSlider');
        const labelSizeSlider = document.getElementById('labelSizeSlider');
        const titleSizeSlider = document.getElementById('titleSizeSlider');
        const canvasHeightSlider = document.getElementById('canvasHeightSlider');
        const gridSlider = document.getElementById('gridSlider');
        const lineWidthSlider = document.getElementById('lineWidthSlider');
        const pointSizeSlider = document.getElementById('pointSizeSlider');
        
        const efValue = document.getElementById('efValue');
        const lineValue = document.getElementById('lineValue');
        const ahValue = document.getElementById('ahValue');
        const areaValue = document.getElementById('areaValue');
        const ansValue = document.getElementById('ansValue');
        const labelSizeValue = document.getElementById('labelSizeValue');
        const titleSizeValue = document.getElementById('titleSizeValue');
        const canvasHeightValue = document.getElementById('canvasHeightValue');
        const gridValue = document.getElementById('gridValue');
        const lineWidthValue = document.getElementById('lineWidthValue');
        const pointSizeValue = document.getElementById('pointSizeValue');
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomValue = document.getElementById('zoomValue');
        
        let pointRadius = 5; 
        const labelOffset = 12;
        let translateX = -40;
        let translateY = 20;
        let zoomLevel = 1.0; // 默认缩放级别
        let efRatio = 0.4, lineRatio = 0, areaRatio = 0, ahRatio = 0;
        let ansRatio = 0, labelSize = 30, titleSize = 20, gridRatio = 0;
        const shadowColor = 'rgba(255,105,180,0.45)';
        let canvasW, canvasH;
        
        // 图形拖动相关变量
        let isDraggingGraph = false;
        let lastMousePos = {x: 0, y: 0};
        let initialTranslateX = 0;
        let initialTranslateY = 0;
        
        // 标签拖动相关变量
        let isDraggingLabel = false;
        let draggedLabel = null;
        const dragOffset = {x: 0, y: 0};
        const labelPositions = {};
        
        // 自动运动相关变量
        let isAutoMotion = false;
        let autoMotionDirection = 1; // 1表示正方向，-1表示反方向
        
        // 图形点全局变量
        let A, B, C, E, F, M, N, H;

        function initCanvas() {
            canvasW = canvas.width = canvas.offsetWidth;
            canvasH = canvas.height = canvas.offsetHeight;
            ctx.lineWidth = 3;
            drawGraph();
        }

        function drawGraph() {
            ctx.clearRect(0, 0, canvasW, canvasH);
            const abLen = canvasW * 0.5 * zoomLevel;
            const topY = canvasH * 0.5 + translateY;
            const leftX = canvasW * 0.25 + translateX;
            
            // 绘制网格
            if (gridRatio > 0) {
                ctx.strokeStyle = `rgba(255, 255, 255, ${gridRatio * 0.5})`;
                ctx.lineWidth = 1;
                const gridSize = 20;
                
                // 垂直网格线
                for (let x = 0; x <= canvasW; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvasH);
                    ctx.stroke();
                }
                
                // 水平网格线
                for (let y = 0; y <= canvasH; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvasW, y);
                    ctx.stroke();
                }
                
                // 恢复原线宽
                ctx.lineWidth = 3;
            }

            // 等腰△ABC 顶点坐标（AB=AC）
            A = {x: leftX, y: topY};
            B = {x: leftX + abLen, y: topY};
            C = {x: A.x + abLen * Math.cos(Math.PI/4), y: A.y - abLen * Math.sin(Math.PI/4)};
            E = {x: A.x + (B.x - A.x) * efRatio, y: topY};

            // BF=AE 且 BF∥AC 计算F点
            const AE_len = Math.hypot(E.x - A.x, E.y - A.y);
            const AC_vecX = C.x - A.x;
            const AC_vecY = C.y - A.y;
            const AC_len = Math.hypot(AC_vecX, AC_vecY);
            const AC_unitX = AC_vecX / AC_len;
            const AC_unitY = AC_vecY / AC_len;
            F = {x: B.x + AE_len * AC_unitX, y: B.y + AE_len * AC_unitY};

            // C点垂线垂足 M(C⊥AB)、N(C⊥BF)
            M = {x: C.x, y: topY};
            const BF_vecX = F.x - B.x;
            const BF_vecY = F.y - B.y;
            const t = ((C.x - B.x)*BF_vecX + (C.y - B.y)*BF_vecY) / (BF_vecX**2 + BF_vecY**2);
            N = {x: B.x + t * BF_vecX, y: B.y + t * BF_vecY};

            // 正确A到BC的高线 垂足H（H在BC边上，AH⊥BC）
            const vecBA = {x: A.x - B.x, y: A.y - B.y};
            const vecBC = {x: C.x - B.x, y: C.y - B.y};
            const dot = vecBA.x * vecBC.x + vecBA.y * vecBC.y;
            const lenBC = Math.hypot(vecBC.x, vecBC.y);
            const ratioBH = dot / (lenBC * lenBC);
            H = {
                x: B.x + ratioBH * vecBC.x,
                y: B.y + ratioBH * vecBC.y
            };

            // 1. △CBE 固定阴影
            ctx.fillStyle = shadowColor;
            ctx.beginPath();
            ctx.moveTo(C.x, C.y);
            ctx.lineTo(B.x, B.y);
            ctx.lineTo(E.x, E.y);
            ctx.closePath();
            ctx.fill();

            // 2. 面积转移阴影
            const bfcAlpha = 0.45 * (1 - areaRatio);
            ctx.fillStyle = `rgba(255,105,180,${bfcAlpha})`;
            ctx.beginPath();ctx.moveTo(B.x,B.y);ctx.lineTo(F.x,F.y);ctx.lineTo(C.x,C.y);ctx.closePath();ctx.fill();
            const caeAlpha = 0.45 * areaRatio;
            ctx.fillStyle = `rgba(255,105,180,${caeAlpha})`;
            ctx.beginPath();ctx.moveTo(C.x,C.y);ctx.lineTo(A.x,A.y);ctx.lineTo(E.x,E.y);ctx.closePath();ctx.fill();

            // 绘制所有实线边框
            ctx.strokeStyle = '#ffffff';
            ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.lineTo(C.x,C.y);ctx.closePath();ctx.stroke();
            ctx.beginPath();ctx.moveTo(C.x,C.y);ctx.lineTo(E.x,E.y);ctx.stroke();
            ctx.beginPath();ctx.moveTo(B.x,B.y);ctx.lineTo(F.x,F.y);ctx.stroke();
            ctx.beginPath();ctx.moveTo(C.x,C.y);ctx.lineTo(F.x,F.y);ctx.stroke();

            // 四边形CEBF虚线边框
            ctx.setLineDash([5,3]);
            ctx.beginPath();ctx.moveTo(C.x,C.y);ctx.lineTo(E.x,E.y);ctx.lineTo(B.x,B.y);ctx.lineTo(F.x,F.y);ctx.closePath();ctx.stroke();

            // C点垂线（滑块控制延伸）
            const CM_x = C.x + (M.x - C.x) * lineRatio;
            const CM_y = C.y + (M.y - C.y) * lineRatio;
            ctx.beginPath();ctx.moveTo(C.x,C.y);ctx.lineTo(CM_x,CM_y);ctx.stroke();
            const CN_x = C.x + (N.x - C.x) * lineRatio;
            const CN_y = C.y + (N.y - C.y) * lineRatio;
            ctx.beginPath();ctx.moveTo(C.x,C.y);ctx.lineTo(CN_x,CN_y);ctx.stroke();

            // A点高线AH（滑块控制延伸，拉满显示）
            const AH_x = A.x + (H.x - A.x) * ahRatio;
            const AH_y = A.y + (H.y - A.y) * ahRatio;
            ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(AH_x,AH_y);ctx.stroke();
            ctx.setLineDash([]);

            // 绘制顶点
            drawPoint(A,'#ffff33');drawPoint(B,'#ffff33');drawPoint(C,'#ffff33');
            drawPoint(E,'#ff4081');drawPoint(F,'#4fc3f7');
            if(lineRatio >= 1){drawPoint(M,'#40e0d0');drawPoint(N,'#40e0d0');}
            if(ahRatio >= 1){drawPoint(H,'#40e0d0');}

            // 标签
            drawLabel('A',A,0,labelOffset,'center','top');
            drawLabel('B',B,0,labelOffset,'center','top');
            drawLabel('C',C,0,-labelOffset,'center','bottom');
            drawLabel('E',E,0,labelOffset,'center','top');
            drawLabel('F',F,labelOffset,0,'start','middle');
            if(lineRatio >= 1){drawLabel('M',M,0,labelOffset,'center','top');drawLabel('N',N,labelOffset,labelOffset,'start','top');}
            if(ahRatio >= 1){drawLabel('H',H,0,labelOffset,'center','top');}
            
            // 显示答案与解析
            if (ansRatio > 0) {
                ctx.save();
                ctx.globalAlpha = ansRatio;
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold 18px Segoe UI`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.textShadow = '0 0 5px rgba(0, 0, 0, 0.8)';
                
                // 在画布底部显示答案
                const startY = canvasH - 100;
                ctx.fillText('四边形EBFC的面积计算：', canvasW / 2, startY);
                ctx.fillText('1. 由于△CEB面积 = △CFB面积', canvasW / 2, startY + 25);
                ctx.fillText('2. 四边形EBFC面积 = △CEB + △CFB = △ABC面积', canvasW / 2, startY + 50);
                ctx.fillText('3. △ABC面积 = (10 × 12) / 2 = 60', canvasW / 2, startY + 75);
                ctx.fillText('答案：60', canvasW / 2, startY + 100);
                
                ctx.restore();
            }
        }

        function drawPoint(p,color){
            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.arc(p.x,p.y,pointRadius,0,Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.lineWidth = 3;
        }

        function drawLabel(txt,p,ox,oy,align='center',base='middle'){
            const pos = labelPositions[txt] || {x: ox, y: oy};
            ctx.save();
            ctx.fillStyle = '#fff';
            ctx.font = `italic ${labelSize}px Times New Roman`;
            ctx.textAlign = align;
            ctx.textBaseline = base;
            ctx.textShadow = '0 0 3px #000';
            ctx.fillText(txt,p.x+pos.x,p.y+pos.y);
            ctx.restore();
        }
        
        function getLabelAtPosition(mouseX, mouseY) {
            // 定义所有标签的位置信息
            const labels = [
                {name: 'A', point: A, offset: {x: 0, y: labelOffset}, align: 'center', base: 'top'},
                {name: 'B', point: B, offset: {x: 0, y: labelOffset}, align: 'center', base: 'top'},
                {name: 'C', point: C, offset: {x: 0, y: -labelOffset}, align: 'center', base: 'bottom'},
                {name: 'E', point: E, offset: {x: 0, y: labelOffset}, align: 'center', base: 'top'},
                {name: 'F', point: F, offset: {x: labelOffset, y: 0}, align: 'start', base: 'middle'},
                {name: 'M', point: M, offset: {x: 0, y: labelOffset}, align: 'center', base: 'top'},
                {name: 'N', point: N, offset: {x: labelOffset, y: labelOffset}, align: 'start', base: 'top'},
                {name: 'H', point: H, offset: {x: 0, y: labelOffset}, align: 'center', base: 'top'}
            ];
            
            // 检查鼠标是否在某个标签的点击区域内
            for (const label of labels) {
                const pos = labelPositions[label.name] || label.offset;
                const labelX = label.point.x + pos.x;
                const labelY = label.point.y + pos.y;
                
                // 根据文本对齐方式和基线调整边界
                let textWidth, textHeight;
                ctx.save();
                ctx.font = `italic ${labelSize}px Times New Roman`;
                ctx.textAlign = label.align;
                ctx.textBaseline = label.base;
                const metrics = ctx.measureText(label.name);
                textWidth = metrics.width;
                textHeight = labelSize;
                ctx.restore();
                
                // 计算标签的边界框
                let left, top, right, bottom;
                if (label.align === 'center') {
                    left = labelX - textWidth / 2;
                    right = labelX + textWidth / 2;
                } else if (label.align === 'start' || label.align === 'left') {
                    left = labelX;
                    right = labelX + textWidth;
                } else {
                    left = labelX - textWidth;
                    right = labelX;
                }
                
                if (label.base === 'middle') {
                    top = labelY - textHeight / 2;
                    bottom = labelY + textHeight / 2;
                } else if (label.base === 'top') {
                    top = labelY;
                    bottom = labelY + textHeight;
                } else {
                    top = labelY - textHeight;
                    bottom = labelY;
                }
                
                // 添加一些额外的点击区域
                const clickPadding = 10;
                left -= clickPadding;
                right += clickPadding;
                top -= clickPadding;
                bottom += clickPadding;
                
                // 检查鼠标是否在标签区域内
                if (mouseX >= left && mouseX <= right && mouseY >= top && mouseY <= bottom) {
                    return label;
                }
            }
            
            return null;
        }

        // 滑块独立联动，带值显示
        efSlider.addEventListener('input',function(){efRatio=this.value/100;efValue.innerText=this.value+'%';drawGraph();});
        lineSlider.addEventListener('input',function(){lineRatio=this.value/100;lineValue.innerText=this.value+'%';drawGraph();});
        ahSlider.addEventListener('input',function(){ahRatio=this.value/100;ahValue.innerText=this.value+'%';drawGraph();});
        areaSlider.addEventListener('input',function(){areaRatio=this.value/100;areaValue.innerText=this.value+'%';drawGraph();});
        ansSlider.addEventListener('input',function(){ansRatio=this.value/100;ansValue.innerText=this.value+'%';drawGraph();});
        labelSizeSlider.addEventListener('input',function(){labelSize=parseInt(this.value);labelSizeValue.innerText=this.value+'px';drawGraph();});
        titleSizeSlider.addEventListener('input',function(){titleSize=parseInt(this.value);titleSizeValue.innerText=this.value+'px';document.querySelector('.geom-condition').style.fontSize=titleSize+'px';});
        canvasHeightSlider.addEventListener('input',function(){const height=parseInt(this.value);canvas.height=height;canvas.style.height=height+'px';canvasHeightValue.innerText=height+'px';initCanvas();});
        gridSlider.addEventListener('input',function(){gridRatio=this.value/100;gridValue.innerText=this.value+'%';drawGraph();});
        lineWidthSlider.addEventListener('input',function(){ctx.lineWidth=parseInt(this.value);lineWidthValue.innerText=this.value+'px';drawGraph();});
        pointSizeSlider.addEventListener('input',function(){pointRadius=parseInt(this.value);pointSizeValue.innerText=this.value+'px';drawGraph();});
        zoomSlider.addEventListener('input',function(){zoomLevel=this.value/100;zoomValue.innerText=this.value+'%';drawGraph();});
        
        // 自动运动功能
        function autoMotion() {
            if (!isAutoMotion) return;
            
            // 更新E、F点的位置比例
            efRatio += autoMotionDirection * 0.01;
            
            // 当比例达到边界时改变方向
            if (efRatio >= 1.0) {
                efRatio = 1.0;
                autoMotionDirection = -1;
            } else if (efRatio <= 0.0) {
                efRatio = 0.0;
                autoMotionDirection = 1;
            }
            
            // 更新滑块值
            efSlider.value = Math.round(efRatio * 100);
            efValue.innerText = efSlider.value + '%';
            
            // 绘制图形
            drawGraph();
            
            // 继续自动运动
            requestAnimationFrame(autoMotion);
        }
        
        // 自动运动按钮事件
        const autoBtn = document.getElementById('autoBtn');
        autoBtn.addEventListener('click', () => {
            isAutoMotion = !isAutoMotion;
            autoBtn.innerText = isAutoMotion ? '停止运动' : '自动运动';
            autoBtn.style.background = isAutoMotion ? 'linear-gradient(to right, #ff5252, #e53935)' : 'linear-gradient(to right, #ffd600, #ffab00)';
            
            if (isAutoMotion) {
                autoMotion();
            }
        });
        
        // 滑动条改变时取消自动运动
        const allSliders = document.querySelectorAll('.control-slider');
        allSliders.forEach(slider => {
            slider.addEventListener('input', () => {
                isAutoMotion = false;
                autoBtn.innerText = '自动运动';
                autoBtn.style.background = 'linear-gradient(to right, #ffd600, #ffab00)';
            });
        });

        // 鼠标事件处理（标签拖动和图形拖动）
        canvas.addEventListener('mousedown', function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // 绘制一次图形以确保所有点都已定义
            drawGraph();
            
            const label = getLabelAtPosition(mouseX, mouseY);
            if (label) {
                // 点击在标签上，开始拖动标签
                isDraggingLabel = true;
                draggedLabel = label.name;
                const pos = labelPositions[label.name] || label.offset;
                dragOffset.x = mouseX - (label.point.x + pos.x);
                dragOffset.y = mouseY - (label.point.y + pos.y);
            } else {
                // 没有点击在标签上，开始拖动图形
                isDraggingGraph = true;
                lastMousePos = {x: mouseX, y: mouseY};
                initialTranslateX = translateX;
                initialTranslateY = translateY;
            }
        });
        
        canvas.addEventListener('mousemove', function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            if (isDraggingLabel && draggedLabel) {
                // 绘制一次图形以确保所有点都已定义
                drawGraph();
                
                // 查找被拖动的标签
                const labels = [
                    {name: 'A', point: A}, {name: 'B', point: B}, {name: 'C', point: C}, 
                    {name: 'E', point: E}, {name: 'F', point: F}, {name: 'M', point: M}, 
                    {name: 'N', point: N}, {name: 'H', point: H}
                ];
                const label = labels.find(l => l.name === draggedLabel);
                
                if (label) {
                    // 更新标签位置
                    labelPositions[draggedLabel] = {
                        x: mouseX - label.point.x - dragOffset.x,
                        y: mouseY - label.point.y - dragOffset.y
                    };
                    drawGraph();
                }
            } else if (isDraggingGraph) {
                // 拖动图形
                const dx = mouseX - lastMousePos.x;
                const dy = mouseY - lastMousePos.y;
                
                // 直接更新平移量，不进行严格的边界检查
                translateX += dx;
                translateY += dy;
                
                // 重新绘制图形
                drawGraph();
                
                // 更新鼠标位置
                lastMousePos = {x: mouseX, y: mouseY};
            }
        });
        
        canvas.addEventListener('mouseup', function() {
            isDraggingLabel = false;
            draggedLabel = null;
            isDraggingGraph = false;
        });
        
        canvas.addEventListener('mouseleave', function() {
            isDraggingLabel = false;
            draggedLabel = null;
            isDraggingGraph = false;
        });
        
        window.onload = initCanvas;
        window.addEventListener('resize', initCanvas);
    </script>
</body>
</html>
