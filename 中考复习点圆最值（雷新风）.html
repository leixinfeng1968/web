<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点圆最值 - 点M到圆上点P距离</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            padding: 20px;
            color: #fff;
            gap: 15px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 700px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            background: linear-gradient(to right, #ffd600, #ffab00);
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .geom-condition {
            font-size: 1.1rem;
            font-weight: 500;
            padding: 12px 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            border: 2px solid rgba(100,255,218,0.4);
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            color: #64ffda;
            text-align: left;
            line-height: 1.6;
            text-indent: 2em;
        }
        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .main {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .canvas-wrapper {
            flex: 1;
            min-width: 300px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 10px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(100,255,218,0.2);
        }
        #canvas {
            width: 100%;
            height: 400px;
            display: block;
            background: rgba(10,25,47,0.4);
            border-radius: 8px;
            border: 1px solid rgba(100,255,218,0.15);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
        }
        .control-panel {
            width: 100%;
            max-width: 320px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(100,255,218,0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 0 auto;
        }
        .control-panel h3 {
            font-size: 1.1rem;
            color: #ffd600;
            margin-bottom: 5px;
            text-align: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label {
            font-weight: 600;
            color: #fff;
            font-size: 14px;
            white-space: nowrap;
            display: inline-block;
            width: 80px;
        }
        input[type="range"] {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffd600;
            cursor: pointer;
            border: 2px solid #fff;
        }
        span {
            color: #ffd600;
            font-size: 13px;
            min-width: 35px;
            text-align: center;
        }
        button {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
        #maxBtn {
            background-color: #ff9f43;
        }
        #maxBtn:hover {
            background-color: #e68a00;
        }
        #minBtn {
            background-color: #198754;
        }
        #minBtn:hover {
            background-color: #146c43;
        }
        .info {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 15px;
            color: #fff;
            text-align: center;
            border: 1px solid rgba(100,255,218,0.3);
        }
        .highlight {
            color: #ffd600;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }
            .control-panel {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>点圆最值</h1>
        <div class="geom-condition">
            点M(圆外定点) 到 圆上动点P 距离：最大值 = |MO| + r，最小值 = |MO| - r
        </div>
    </div>

    <div class="container">
        <div class="main">
            <div class="canvas-wrapper">
                <canvas id="canvas" width="800" height="400"></canvas>
            </div>

            <div class="control-panel">
                <h3>控制参数</h3>
                <div class="control-group">
                    <label>圆半径 r</label>
                    <input type="range" id="radiusSlider" min="20" max="100" value="50">
                    <span id="radiusValue">50</span>
                </div>
                <div class="control-group">
                    <label>点M X轴</label>
                    <input type="range" id="mxSlider" min="100" max="700" value="600">
                    <span id="mxValue">600</span>
                </div>
                <div class="control-group">
                    <label>点M Y轴</label>
                    <input type="range" id="mySlider" min="100" max="300" value="200">
                    <span id="myValue">200</span>
                </div>
                <div class="control-group">
                    <button id="toggleBtn">开始运动</button>
                    <button id="maxBtn">移动到最大值</button>
                    <button id="minBtn">移动到最小值</button>
                </div>
                <div class="info">
                    当前距离 = <span class="highlight" id="currentDist">0</span>
                </div>
                <div class="control-group">
                    <label>题目文字大小</label>
                    <input type="range" id="fontSlider" min="80" max="200" value="100">
                    <span id="fontValue">100%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 获取画布和上下文
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fontSlider = document.getElementById('fontSlider');
        const fontValue = document.getElementById('fontValue');
        const geomCondition = document.querySelector('.geom-condition');
        // 配置参数
        let radius = 50;
        let mx = 600, my = 200;
        const ox = 400, oy = 200; // 圆心固定
        let angle = 0;
        let isMoving = false;
        let animationId;
        // 平滑移动相关参数
        let targetAngle = null;
        const moveSpeed = 0.03; // 移动速度，值越小越慢

        // 拖动相关变量
        let panX = 0, panY = 0;
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;

        // 初始化画布
        function initCanvas() {
            const canvasWrapper = document.querySelector('.canvas-wrapper');
            canvas.width = canvasWrapper.clientWidth - 20;
            canvas.height = 400;
            ox = canvas.width / 2;
            oy = canvas.height / 2;
            draw();
        }

        // 初始化滑块事件
        document.getElementById('radiusSlider').addEventListener('input', function() {
            radius = parseInt(this.value);
            document.getElementById('radiusValue').textContent = radius;
            draw();
        });
        document.getElementById('mxSlider').addEventListener('input', function() {
            mx = parseInt(this.value);
            document.getElementById('mxValue').textContent = mx;
            draw();
        });
        document.getElementById('mySlider').addEventListener('input', function() {
            my = parseInt(this.value);
            document.getElementById('myValue').textContent = my;
            draw();
        });

        // 运动启停按钮
        document.getElementById('toggleBtn').addEventListener('click', function() {
            if (targetAngle !== null) return; // 平滑移动中禁止启停
            isMoving = !isMoving;
            this.textContent = isMoving ? '停止运动' : '开始运动';
            isMoving ? animate() : cancelAnimationFrame(animationId);
        });

        // 移动到最大值按钮
        document.getElementById('maxBtn').addEventListener('click', function() {
            if (isMoving) {
                cancelAnimationFrame(animationId);
                isMoving = false;
                document.getElementById('toggleBtn').textContent = '开始运动';
            }
            // 计算最大值目标角度
            targetAngle = Math.atan2(oy - my, ox - mx);
            animateMove();
        });

        // 移动到最小值按钮
        document.getElementById('minBtn').addEventListener('click', function() {
            if (isMoving) {
                cancelAnimationFrame(animationId);
                isMoving = false;
                document.getElementById('toggleBtn').textContent = '开始运动';
            }
            // 计算最小值目标角度
            targetAngle = Math.atan2(my - oy, mx - ox);
            animateMove();
        });

        fontSlider.addEventListener('input', function() {
            const fontSize = fontSlider.value / 100;
            fontValue.textContent = `${fontSlider.value}%`;
            geomCondition.style.fontSize = `${fontSize}rem`;
        });

        // 计算两点距离
        function distance(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }

        // 角度差值计算（处理圆周角度循环）
        function angleDiff(current, target) {
            let diff = target - current;
            diff = diff > Math.PI ? diff - 2 * Math.PI : diff < -Math.PI ? diff + 2 * Math.PI : diff;
            return diff;
        }

        // 绘制函数
        function draw() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(panX, panY);
            // 计算点P坐标
            const px = ox + radius * Math.cos(angle);
            const py = oy + radius * Math.sin(angle);
            // 计算距离
            const moDist = distance(mx, my, ox, oy);
            const mpDist = distance(mx, my, px, py);
            const maxDist = (moDist + radius).toFixed(1);
            const minDist = (moDist - radius).toFixed(1);
            document.getElementById('currentDist').textContent = mpDist.toFixed(1);

            // 计算最值点
            const maxDirX = (ox - mx) / moDist;
            const maxDirY = (oy - my) / moDist;
            const maxPx = ox + maxDirX * radius;
            const maxPy = oy + maxDirY * radius;

            const minDirX = (mx - ox) / moDist;
            const minDirY = (my - oy) / moDist;
            const minPx = ox + minDirX * radius;
            const minPy = oy + minDirY * radius;

            // 1. 绘制圆
            ctx.beginPath();
            ctx.arc(ox, oy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#1f77b4';
            ctx.lineWidth = 2;
            ctx.stroke();
            // 绘制圆心O
            ctx.beginPath();
            ctx.arc(ox, oy, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#1f77b4';
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = '14px Arial';
            ctx.fillText('O', ox + 8, oy);

            // 2. 绘制定点M
            ctx.beginPath();
            ctx.arc(mx, my, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#e53e3e';
            ctx.fill();
            ctx.fillText('M', mx + 8, my);

            // 3. 绘制动点P
            ctx.beginPath();
            ctx.arc(px, py, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#198754';
            ctx.fill();
            ctx.fillText('P', px + 8, py);

            // 4. 绘制辅助线MO
            ctx.beginPath();
            ctx.moveTo(mx, my);
            ctx.lineTo(ox, oy);
            ctx.strokeStyle = '#969696';
            ctx.lineWidth = 1;
            ctx.stroke();

            // 5. 绘制当前MP线段
            ctx.beginPath();
            ctx.moveTo(mx, my);
            ctx.lineTo(px, py);
            ctx.strokeStyle = '#e53e3e';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 6. 绘制最值线段
            // 最大值
            ctx.beginPath();
            ctx.moveTo(mx, my);
            ctx.lineTo(maxPx, maxPy);
            ctx.strokeStyle = '#ff9f43';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(maxPx, maxPy, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ff9f43';
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.fillText('Max', maxPx + 8, maxPy);
            // 最小值
            ctx.beginPath();
            ctx.moveTo(mx, my);
            ctx.lineTo(minPx, minPy);
            ctx.strokeStyle = '#198754';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(minPx, minPy, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#198754';
            ctx.fill();
            ctx.fillText('Min', minPx + 8, minPy);

            // 7. 绘制数值信息
            ctx.fillStyle = '#000';
            ctx.fillText(`|MO| = ${moDist.toFixed(1)}`, 20, 20);
            ctx.fillText(`最大值 = ${maxDist}`, 20, 45);
            ctx.fillText(`最小值 = ${minDist}`, 20, 70);
            ctx.restore();
        }

        // 常规动画（圆周运动）
        function animate() {
            angle += 0.02;
            draw();
            animationId = requestAnimationFrame(animate);
        }

        // 平滑移动到目标角度的动画
        function animateMove() {
            if (targetAngle === null) return;
            // 计算当前角度与目标角度的差值
            const diff = angleDiff(angle, targetAngle);
            // 判断是否到达目标角度
            if (Math.abs(diff) < moveSpeed) {
                angle = targetAngle;
                targetAngle = null; // 重置目标角度
                draw();
                return;
            }
            // 逐步逼近目标角度
            angle += diff > 0 ? moveSpeed : -moveSpeed;
            draw();
            requestAnimationFrame(animateMove);
        }

        // 拖动功能 - 鼠标事件
        canvas.addEventListener('mousedown', function(e) {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', function(e) {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                panX += deltaX;
                panY += deltaY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                draw();
            }
        });

        canvas.addEventListener('mouseup', function() {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });

        canvas.addEventListener('mouseleave', function() {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });

        // 拖动功能 - 触摸事件
        canvas.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
                e.preventDefault();
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', function(e) {
            if (isDragging && e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                panX += deltaX;
                panY += deltaY;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
                draw();
                e.preventDefault();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', function() {
            isDragging = false;
        });

        canvas.style.cursor = 'grab';

        // 初始绘制
        window.onload = initCanvas;
        window.addEventListener('resize', initCanvas);
    </script>
</body>
</html>
