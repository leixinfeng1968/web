<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>欢迎来到雷老师微课堂 ～</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}
        body {display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#1a237e,#0d47a1);padding:20px;color:#fff;overflow-x:hidden}
        .container {width:100%;max-width:1400px;display:flex;flex-direction:column;gap:20px}
        .header {text-align:center;width:100%}
        h1 {font-size:2rem;margin-bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,0.6);background:linear-gradient(to right,#ffd600,#ffab00);-webkit-background-clip:text;color:transparent;letter-spacing:1px}
        .geom-condition {font-size:1.1rem;font-weight:500;padding:12px 15px;background:rgba(255,255,255,0.1);border-radius:8px;border:2px solid rgba(100,255,218,0.4);box-shadow:0 3px 10px rgba(0,0,0,0.3);color:#ffda8b;text-align:left;line-height:1.6;margin-bottom:20px}
        .btn-group {text-align:center;margin-bottom:20px}
        .auto-btn {padding:10px 20px;border:none;border-radius:6px;background:linear-gradient(to right,#ffd600,#ffab00);color:#1a237e;font-weight:bold;font-size:0.95rem;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,0.3)}
        .auto-btn:hover {opacity:0.9}
        
        .main {display:flex;gap:20px;width:100%;align-items:flex-start}
        .canvas-wrapper {
            flex:1;
            background:rgba(255,255,255,0.08);
            border-radius:12px;
            padding:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter:blur(8px);
            border:1px solid rgba(100,255,218,0.2);
            display:flex;
            flex-direction:column;
            gap:12px;
            min-height:400px;
        }
        
        .control-panel {
            width:350px;
            background:rgba(255,255,255,0.08);
            border-radius:12px;
            padding:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter:blur(8px);
            border:1px solid rgba(100,255,218,0.2);
            display:flex;
            flex-direction:column;
            gap:12px;
        }
        
        .control-panel h3 {
            margin:0 0 10px 0;
            font-size:18px;
            color:#64ffda;
            text-align:center;
            border-bottom:1px solid rgba(100,255,218,0.3);
            padding-bottom:10px;
        }
        
        #myCanvas {width:100%;height:400px;display:block;background:rgba(10,25,47,0.4);border-radius:8px;border:1px solid rgba(100,255,218,0.15);box-shadow:inset 0 0 15px rgba(0,0,0,0.4)}

        .single-slider {display:flex;align-items:center;gap:10px;width:100%}
        .single-slider span {font-size:0.9rem;color:#fff;white-space:nowrap;display:inline-block;width:180px}
        .slider-value {width:40px;text-align:center;color:#ffd600;font-weight:bold}
        .control-slider {flex:1;height:6px;background:rgba(255,255,255,0.2);border-radius:3px;outline:none;-webkit-appearance:none}
        .control-slider::-webkit-slider-thumb {-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#ffd600;cursor:pointer;border:2px solid #fff}
        .footer {text-align:center;opacity:0.9;width:100%;padding:15px 0;color:#e3f2fd;margin-top:15px}
        .blank-line{display:inline-block;width:60px;height:2px;background:#ffda8b;vertical-align:bottom;margin:0 5px;}
        .draw-btn {padding:10px 20px;border:none;border-radius:6px;background:linear-gradient(to right,#ffd600,#ffab00);color:#1a237e;font-weight:bold;font-size:0.95rem;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,0.3);margin-top:5px}
        .draw-btn:hover {opacity:0.9}
        .think-hint {width:100%;max-width:800px;margin:15px auto 0;padding:8px;border:2px solid #FFB74D;border-radius:8px;background-color:rgba(255,248,225,0.1);font-family:'Segoe UI', 'Microsoft YaHei';font-size:13px;color:#ffd740;text-align:center;opacity:0;transition:opacity 0.3s ease, box-shadow 0.3s ease}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2023年陕西中考数学第13题</h1>
            <div class="geom-condition">
                题目：如图，在矩形ABCD中，AB＝3，BC＝4．点E在边AD上，且ED＝3，M、N分别是边AB、BC上的动点，且BM＝BN，P是线段CE上的动点，连接PM，PN．若PM＋PN＝4．则线段PC的长为 　<span class="blank-line"></span>。
            </div>
            <div class="btn-group">
                <button class="auto-btn" id="autoBtn">自动运动</button>
            </div>
        </div>
        
        <div class="main">
            <div class="canvas-wrapper">
                <canvas id="myCanvas"></canvas>
            </div>
            
            <div class="control-panel">
                <h3>控制参数</h3>
                <div class="single-slider">
                    <span>控制M、N运动</span>
                    <input type="range" min="0" max="100" value="30" class="control-slider" id="mnSlider">
                    <span class="slider-value" id="mnValue">30%</span>
                </div>
                <div class="single-slider">
                    <span>控制P点运动</span>
                    <input type="range" min="0" max="100" value="70" class="control-slider" id="pSlider">
                    <span class="slider-value" id="pValue">70%</span>
                </div>
                <div class="single-slider">
                    <span>控制∠ABC平分线延伸</span>
                    <input type="range" min="0" max="100" value="0" class="control-slider" id="bhSlider">
                    <span class="slider-value" id="bhValue">0%</span>
                </div>
                <div class="single-slider">
                    <span>图形缩放比例</span>
                    <input type="range" min="50" max="500" value="100" class="control-slider" id="scaleSlider">
                    <span class="slider-value" id="scaleValue">100%</span>
                </div>
                <div class="single-slider">
                    <span>标签字号大小</span>
                    <input type="range" min="10" max="50" value="16" class="control-slider" id="labelSizeSlider">
                    <span class="slider-value" id="labelSizeValue">16px</span>
                </div>
                <div class="single-slider">
                    <span>题目文字大小</span>
                    <input type="range" min="12" max="50" value="16" class="control-slider" id="titleSizeSlider">
                    <span class="slider-value" id="titleSizeValue">16px</span>
                </div>
                <div class="single-slider">
                    <span>画布高度</span>
                    <input type="range" min="300" max="600" value="400" class="control-slider" id="canvasHeightSlider">
                    <span class="slider-value" id="canvasHeightValue">400px</span>
                </div>
                <div class="single-slider">
                    <span>显示思考提示</span>
                    <input type="range" min="0" max="100" value="0" class="control-slider" id="hintSlider">
                    <span class="slider-value" id="hintValue">0%</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="think-hint" id="thinkHint">
        思考：① 如何利用BM=BN的条件？② 如何找到PM+PN的最小值？③ 角平分线在解题中有什么作用？
    </div>
    
    <div class="footer">
        <p>2026.1.20 制作，作者：雷新风</p>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const mnSlider = document.getElementById('mnSlider');
        const pSlider = document.getElementById('pSlider');
        const bhSlider = document.getElementById('bhSlider');
        const scaleSlider = document.getElementById('scaleSlider');
        const labelSizeSlider = document.getElementById('labelSizeSlider');
        const titleSizeSlider = document.getElementById('titleSizeSlider');
        const canvasHeightSlider = document.getElementById('canvasHeightSlider');
        const hintSlider = document.getElementById('hintSlider');
        const mnValue = document.getElementById('mnValue');
        const pValue = document.getElementById('pValue');
        const bhValue = document.getElementById('bhValue');
        const scaleValue = document.getElementById('scaleValue');
        const labelSizeValue = document.getElementById('labelSizeValue');
        const titleSizeValue = document.getElementById('titleSizeValue');
        const canvasHeightValue = document.getElementById('canvasHeightValue');
        const hintValue = document.getElementById('hintValue');
        const geomCondition = document.querySelector('.geom-condition');
        const h1Title = document.querySelector('h1');
        const thinkHint = document.getElementById('thinkHint');
        
        const pointRadius = 6; 
        const labelOffset = 12; 
        let canvasW, canvasH, mnRatio=0.3, pRatio=0.7, bhRatio=0;
        let scaleRatio = 1.0, labelSize = 16, titleSize = 16, canvasHeight = 400, hintRatio = 0;
        
        // 自动运动相关变量
        let isAutoMotion = false;
        let autoMotionDirection = 1; // 1表示正方向，-1表示反方向

        function initCanvas(){
            canvasW = canvas.clientWidth;
            canvasH = canvas.clientHeight;
            canvas.width = canvasW;
            canvas.height = canvasH;
            ctx.lineWidth = 3;
            drawGraph();
        }

        function drawGraph(){
            ctx.clearRect(0,0,canvasW,canvasH);
            // 应用缩放比例
            const baseScale = 0.7 * scaleRatio;
            const rectW = canvasW * baseScale;
            const rectH = rectW * 3 / 4; 
            const x0 = (canvasW - rectW)/2; 
            const y0 = 45; 
            const A = {x:x0, y:y0};
            const D = {x:x0+rectW, y:y0};
            const C = {x:x0+rectW, y:y0+rectH};
            const B = {x:x0, y:y0+rectH};
            const E = {x:x0 + rectW * 1/4, y:y0}; 

            // M/N同步运动 BM=BN
            const moveLen = Math.min(rectH, rectW) * mnRatio;
            const M = {x: B.x, y: B.y - moveLen};
            const N = {x: B.x + moveLen, y: B.y};
            // P点在CE上运动
            const P = {x: E.x + (C.x - E.x) * pRatio,y: E.y + (C.y - E.y) * pRatio};

            // 核心：先算BH与CE真实交点H，再按比例从B延伸，初始为B点
            // 1. 求∠ABC平分线（45°）与CE的真实交点H
            const kCE = (E.y - C.y)/(E.x - C.x);
            const bCE = C.y - kCE * C.x;
            const kBHB = -1; // 45°平分线斜率固定-1
            const bBHB = B.y - kBHB * B.x;
            const H_real = {
                x: (bCE - bBHB)/(kBHB - kCE),
                y: kBHB * (bCE - bBHB)/(kBHB - kCE) + bBHB
            };
            // 2. 按比例延伸，从B到H_real逐步显示，bhRatio=0时在B点
            const H_extend = {
                x: B.x + (H_real.x - B.x) * bhRatio,
                y: B.y + (H_real.y - B.y) * bhRatio
            };

            // 绘制图形
            ctx.strokeStyle = '#ffffff';
            // 矩形边框
            ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(D.x,D.y);ctx.lineTo(C.x,C.y);ctx.lineTo(B.x,B.y);ctx.closePath();ctx.stroke();
            // CE线段
            ctx.beginPath();ctx.moveTo(C.x,C.y);ctx.lineTo(E.x,E.y);ctx.stroke();
            // PM、PN线段
            ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(M.x,M.y);ctx.stroke();
            ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(N.x,N.y);ctx.stroke();
            // ∠ABC平分线（虚线，从B逐步延伸到H，初始无显示）
            ctx.setLineDash([6,4]);
            ctx.beginPath();ctx.moveTo(B.x,B.y);ctx.lineTo(H_extend.x,H_extend.y);ctx.stroke();
            ctx.setLineDash([]);

            // 绘制所有顶点（只有延伸到一定长度才显示H点）
            drawPoint(A,'#ffff33');
            drawPoint(B,'#ffff33');
            drawPoint(C,'#ffff33');
            drawPoint(D,'#ffff33');
            drawPoint(E,'#64ffda');
            drawPoint(M,'#ff4081');
            drawPoint(N,'#ff4081');
            drawPoint(P,'#4fc3f7');
            // 延伸比例>0.1才显示H点，避免初始混乱
            if(bhRatio > 0.1){
                drawPoint(H_extend,'#00ff9d');
            }

            // 顶点标注（H在右上方，比例>0.1才显示）
            ctx.font = 'bold italic ' + labelSize + 'px Times New Roman';
            ctx.textShadow = '0 0 3px #000';
            drawLabel('A',A,-labelOffset,-labelOffset,'end','bottom');
            drawLabel('D',D,labelOffset,-labelOffset,'start','bottom');
            drawLabel('C',C,labelOffset,labelOffset,'start','top');
            drawLabel('B',B,-labelOffset,labelOffset,'end','top');
            drawLabel('E',E,labelOffset,-labelOffset,'start','bottom');
            drawLabel('M',M,-labelOffset,0,'end','middle');
            drawLabel('N',N,0,labelOffset,'middle','top');
            drawLabel('P',P,labelOffset,-labelOffset,'start','bottom');
            if(bhRatio > 0.1){
                drawLabel('H',H_extend,labelOffset,-labelOffset,'start','top');
            }
        }

        function drawPoint(p,color){
            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.arc(p.x,p.y,pointRadius,0,Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.lineWidth = 3;
        }

        function drawLabel(txt,p,ox,oy,align,base){
            ctx.save();
            ctx.fillStyle = '#fff';
            ctx.textAlign = align;
            ctx.textBaseline = base;
            ctx.fillText(txt,p.x+ox,p.y+oy);
            ctx.restore();
        }

        // 滑块事件响应
        mnSlider.addEventListener('input',function(){
            mnRatio = this.value / 100;
            mnValue.innerText = this.value + '%';
            drawGraph();
        });
        
        pSlider.addEventListener('input',function(){
            pRatio = this.value / 100;
            pValue.innerText = this.value + '%';
            drawGraph();
        });
        
        bhSlider.addEventListener('input',function(){
            bhRatio = this.value / 100;
            bhValue.innerText = this.value + '%';
            drawGraph();
        });
        
        // 新添加的滑块事件
        scaleSlider.addEventListener('input',function(){
            scaleRatio = this.value / 100;
            scaleValue.innerText = this.value + '%';
            drawGraph();
        });
        
        labelSizeSlider.addEventListener('input',function(){
            labelSize = parseInt(this.value);
            labelSizeValue.innerText = this.value + 'px';
            drawGraph();
        });
        
        titleSizeSlider.addEventListener('input',function(){
            titleSize = parseInt(this.value);
            titleSizeValue.innerText = this.value + 'px';
            geomCondition.style.fontSize = titleSize + 'px';
            h1Title.style.fontSize = (titleSize * 1.25) + 'px';
        });
        
        canvasHeightSlider.addEventListener('input',function(){
            canvasHeight = parseInt(this.value);
            canvasHeightValue.innerText = this.value + 'px';
            canvas.style.height = canvasHeight + 'px';
            initCanvas();
        });
        
        hintSlider.addEventListener('input',function(){
            hintRatio = parseInt(this.value) / 100;
            hintValue.innerText = this.value + '%';
            thinkHint.style.opacity = hintRatio;
        });

        // 自动运动功能
        function autoMotion() {
            if (!isAutoMotion) return;
            
            // 更新M、N点的位置比例
            mnRatio += autoMotionDirection * 0.01;
            
            // 当比例达到边界时改变方向
            if (mnRatio >= 1.0) {
                mnRatio = 1.0;
                autoMotionDirection = -1;
            } else if (mnRatio <= 0.0) {
                mnRatio = 0.0;
                autoMotionDirection = 1;
            }
            
            // 更新滑块值
            mnSlider.value = Math.round(mnRatio * 100);
            mnValue.innerText = mnSlider.value + '%';
            
            // 绘制图形
            drawGraph();
            
            // 继续自动运动
            requestAnimationFrame(autoMotion);
        }
        
        // 自动运动按钮事件
        const autoBtn = document.getElementById('autoBtn');
        autoBtn.addEventListener('click', () => {
            isAutoMotion = !isAutoMotion;
            autoBtn.innerText = isAutoMotion ? '停止运动' : '自动运动';
            autoBtn.style.background = isAutoMotion ? 'linear-gradient(to right, #ff5252, #e53935)' : 'linear-gradient(to right, #ffd600, #ffab00)';
            
            if (isAutoMotion) {
                autoMotion();
            }
        });
        
        // 滑动条改变时取消自动运动
        const allSliders = document.querySelectorAll('.control-slider');
        allSliders.forEach(slider => {
            slider.addEventListener('input', () => {
                isAutoMotion = false;
                autoBtn.innerText = '自动运动';
                autoBtn.style.background = 'linear-gradient(to right, #ffd600, #ffab00)';
            });
        });

        window.onload = initCanvas;
        window.addEventListener('resize',initCanvas);
    </script>
</body>
</html>
