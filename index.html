            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background: linear-gradient(135deg, #0f0f23, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 元宇宙渐变背景动画 */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 背景粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(102, 126, 234, 0.8);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(100px); opacity: 0; }
        }

        /* 头部样式 */
        header {
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            padding: 25px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid rgba(102, 126, 234, 0.5);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.7);
            letter-spacing: 2px;
        }
        


        .subtitle {
            text-align: center;
            color: #a0aec0;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(160, 174, 192, 0.5);
        }

            display: flex;
            justify-content: center;
            margin: 40px 0;
            position: relative;
        }

            width: 550px;
            padding: 18px 25px;
            background: rgba(15, 15, 35, 0.7);
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 30px 0 0 30px;
            font-size: 16px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        #search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
            background: rgba(15, 15, 35, 0.9);
        }

        #search-input::placeholder {
            color: #a0aec0;
        }

            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 0 30px 30px 0;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        #search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;

            color: white;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0 8px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
            background: linear-gradient(135deg, #764ba2, #667eea);

            border-radius: 10px;
            text-align: center;
            font-weight: bold;

                particle.style.animationDelay = Math.random() * 5 + 's';

        // DOM元素
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const coursesGrid = document.getElementById('courses-grid');
        const categoryBtns = document.querySelectorAll('.category-btn');

        // 生成课件卡片
        function renderCourses(coursesToRender) {
            coursesGrid.innerHTML = '';
            
            if (coursesToRender.length === 0) {
                coursesGrid.innerHTML = '<p style="text-align: center; color: #a0aec0; grid-column: 1 / -1; font-size: 1.2rem; padding: 50px;">未找到匹配的课件</p>';
                return;
            }

            coursesToRender.forEach(course => {
                const card = document.createElement('div');
                card.className = 'course-card';
                card.dataset.category = course.category;
                
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${course.title}</h3>
                        <div class="author">作者：${course.author}</div>
                    </div>
                    <div class="card-body">
                        <p>${course.description}</p>
                    </div>
                    <div class="card-footer">
                        <a href="${course.file}" class="course-link" target="_blank">打开课件</a>
                    </div>
                `;
                
                coursesGrid.appendChild(card);
            });
        }

        // 搜索功能
        function searchCourses() {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredCourses = courses.filter(course => 
                course.title.toLowerCase().includes(searchTerm) || 
                course.description.toLowerCase().includes(searchTerm) ||
                course.author.toLowerCase().includes(searchTerm)
            );
            renderCourses(filteredCourses);
        }

        // 分类过滤功能
        function filterByCategory(category) {
            let filteredCourses;
            if (category === 'all') {
                filteredCourses = courses;
            } else {
                filteredCourses = courses.filter(course => course.category === category);
            }
            renderCourses(filteredCourses);
        }

        // 事件监听器
        searchBtn.addEventListener('click', searchCourses);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchCourses();
            }
        });

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 更新活跃状态
                categoryBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // 过滤课件
                const category = btn.dataset.category;
                filterByCategory(category);
            });
        });

        // 文件上传功能
        const fileInput = document.getElementById('file-input');
        let uploadStatusDiv = null;

        // 创建上传状态显示区域
        function createUploadStatus() {
            if (!uploadStatusDiv) {
                uploadStatusDiv = document.createElement('div');
                uploadStatusDiv.className = 'upload-status';
                const headerDiv = document.querySelector('header .container > div:last-child');
                headerDiv.parentNode.insertBefore(uploadStatusDiv, headerDiv.nextSibling);
            }
            return uploadStatusDiv;
        }

        // 显示上传状态
        function showUploadStatus(message, isSuccess = true) {
            const statusDiv = createUploadStatus();
            statusDiv.textContent = message;
            statusDiv.className = `upload-status ${isSuccess ? 'upload-success' : 'upload-error'}`;
            statusDiv.style.display = 'block';
            
            // 3秒后自动隐藏
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }

        // 真正保存文件到本地目录
        function saveFileToServer(filename, content) {
            // 通过HTTP请求保存文件到服务器
            return fetch('http://localhost:8080/upload', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    filename: filename,
                    content: content
                })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    console.log(`文件已保存到: ${result.path}`);
                    return true;
                } else {
                    console.error('保存文件失败:', result.error);
                    return false;
                }
            })
            .catch(error => {
                console.error('保存文件时出错:', error);
                return false;
            });
        }

        function saveFileToLocal(filename, content) {
            // 创建 Blob 对象
            const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            // 创建下载链接
            const a = document.createElement('a');
            a.href = url;
            a.download = `uploads/${filename}`;
            document.body.appendChild(a);
            a.click();
            
            // 清理
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
            
            return true;
        }

        async function handleFileUpload(event) {
            const files = Array.from(event.target.files);
            const fileInput = document.getElementById('file-input');
            
            if (files.length === 0) return;
            
            let uploadedCount = 0;
            let savedCount = 0;
            
            showUploadStatus('开始处理文件...', 'info');
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                if (!file.type.match(/text\/html/)) {
                    showUploadStatus(`❌ ${file.name} 不是有效的HTML文件`, 'error');
                    uploadedCount++;
                    continue;
                }
                
                try {
                    const content = await readFileAsText(file);
                    
                    // 生成唯一文件名
                    const timestamp = Date.now();
                    const randomSuffix = Math.random().toString(36).substr(-6);
                    const uniqueFilename = `${timestamp}_${randomSuffix}_${file.name}`;
                    
                    // 尝试保存到服务器
                    let saved = false;
                    try {
                        saved = await saveFileToServer(uniqueFilename, content);
                    } catch (serverError) {
                        console.log('服务器保存失败，使用本地下载:', serverError);
                    }
                    
                    // 如果服务器保存失败，使用本地下载
                    if (!saved) {
                        saved = saveFileToLocal(uniqueFilename, content);
                    }
                    
                    if (saved) {
                        savedCount++;
                        
                        // 解析HTML内容
                        const courseInfo = parseHTMLContent(content, file.name);
                        
                        // 创建新的课程对象
                        const newCourse = {
                            id: courses.length + i + 1,
                            title: courseInfo.title,
                            description: courseInfo.category,
                            category: courseInfo.category,
                            author: courseInfo.author,
                            filename: uniqueFilename,
                            fileContent: content,
                            uploadedAt: new Date().toLocaleString()
                        };
                        
                        // 检查是否已存在相同标题的课程
                        const existingIndex = courses.findIndex(course => course.title === courseInfo.title);
                        if (existingIndex !== -1) {
                            courses[existingIndex] = newCourse;
                            showUploadStatus(`📝 ${courseInfo.title} 已更新`, 'success');
                        } else {
                            courses.push(newCourse);
                            showUploadStatus(`✅ ${courseInfo.title} 已添加`, 'success');
                        }
                    }
                    
                } catch (error) {
                    showUploadStatus(`❌ 处理 ${file.name} 时出错: ${error.message}`, 'error');
                }
                
                uploadedCount++;
                
                // 所有文件处理完成后重新渲染
                if (uploadedCount === files.length) {
                    renderCourses();
                    fileInput.value = ''; // 清空文件输入
                    
                    setTimeout(() => {
                        if (savedCount > 0) {
                            showUploadStatus(`🎉 成功上传 ${savedCount} 个课件！文件已保存到uploads目录`, 'success');
                        } else {
                            showUploadStatus('⚠️ 文件处理完成，但保存可能失败', 'warning');
                        }
                    }, 500);
                }
            }
        }

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e);
                reader.readAsText(file, 'UTF-8');
            });
        }

        function parseHTMLContent(content, filename) {
            try {
                // 解析HTML内容
                const parser = new DOMParser();
                const doc = parser.parseFromString(content, 'text/html');
                
                // 提取标题
                let title = doc.querySelector('h1')?.textContent || filename.replace('.html', '').replace('.HTML', '');
                
                // 提取作者信息
                let author = "未知作者";
                const authorPatterns = [
                    /作者[：:]\s*([^\n\r<]+)/i,
                    /制作者[：:]\s*([^\n\r<]+)/i,
                    /制作者[：:]\s*([^\n\r<]+)/i
                ];
                
                authorPatterns.forEach(pattern => {
                    const match = content.match(pattern);
                    if (match) {
                        author = match[1].trim();
                    }
                });
                
                // 自动判断分类
                let category = "九年级下册";
                if (title.includes('七年级上册')) category = "七年级上册";
                else if (title.includes('七年级下册')) category = "七年级下册";
                else if (title.includes('八年级上册')) category = "八年级上册";
                else if (title.includes('八年级下册')) category = "八年级下册";
                else if (title.includes('九年级上册')) category = "九年级上册";
                else if (title.includes('九年级下册')) category = "九年级下册";
                else if (title.includes('中考复习')) category = "中考复习";
                
                return {
                    title: title,
                    author: author,
                    category: category
                };
                
            } catch (error) {
                console.error('解析HTML内容时出错:', error);
                return {
                    title: filename.replace('.html', '').replace('.HTML', ''),
                    author: "未知作者",
                    category: "九年级下册"
                };
            }
        }

        // 文件输入变化事件
        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length > 0) {
                handleFileUpload(files);
            }
            // 清空输入，允许重复上传同一文件
            e.target.value = '';
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            renderCourses(courses);
        });
    </script>
