<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025年陕西中考数学第14题</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            color: #fff;
            padding: 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header {
            text-align: center;
            padding: 0 15px;
        }
        h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            background: linear-gradient(to right, #ffd600, #ffab00);
            -webkit-background-clip: text;
            color: transparent;
        }
        .geom-condition {
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            padding: 12px 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            border: 2px solid rgba(100,255,218,0.4);
            color: #ffda8b;
            line-height: 1.6;
            margin-bottom: 15px;
            text-align: left;
            max-width: calc(100% - 30px);
            margin-left: auto;
            margin-right: auto;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .auto-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: #ffd600;
            color: #1a237e;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: clamp(0.9rem, 2vw, 1rem);
        }
        .auto-btn:hover {
            background: #ffab00;
        }
        .auto-btn.active {
            background: #ff4081;
            color: #fff;
        }
        .main {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .canvas-wrapper {
            flex: 1;
            min-width: 300px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 10px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(100,255,218,0.2);
        }
        #myCanvas {
            width: 100%;
            height: 400px;
            background: rgba(10,25,47,0.4);
            border-radius: 8px;
            border: 1px solid rgba(100,255,218,0.15);
            display: block;
        }
        .control-panel {
            width: 100%;
            max-width: 320px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(100,255,218,0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 0 auto;
        }
        .control-panel h3 {
            font-size: clamp(16px, 3vw, 18px);
            color: #64ffda;
            margin-bottom: 5px;
        }
        .single-slider {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .single-slider span {
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            white-space: nowrap;
            width: 120px;
        }
        .slider-value {
            width: 40px;
            text-align: center;
            color: #ffd600;
            font-weight: bold;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
        }
        .control-slider {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffd600;
            cursor: pointer;
            border: 2px solid #fff;
        }
        .footer {
            text-align: center;
            opacity: 0.9;
            padding: 10px 0;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
        }
        .reset-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: linear-gradient(to right, #ff5252, #e53935);
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .reset-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
        }
        .blank-line {
            display: inline-block;
            width: 60px;
            height: 2px;
            background: #ffda8b;
            vertical-align: bottom;
            margin: 0 5px;
        }
        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }
            .control-panel {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2025年陕西中考数学第14题</h1>
            <div class="geom-condition">
                如图，在▱ABCD中，AB＝6，AD＝8，∠B＝60°．动点M，N分别在边AB，AD上，且AM＝AN，以MN为边作等边△MNP，使点P始终在▱ABCD的内部或边上．当△MNP的面积最大时，DN的长为<span class="blank-line"></span>．
            </div>
            <div class="btn-group">
                <button id="autoBtn" class="auto-btn">自动运动</button>
            </div>
        </div>

        <div class="main">
            <div class="canvas-wrapper">
                <canvas id="myCanvas"></canvas>
            </div>

            <div class="control-panel">
                <h3>控制参数</h3>
                <div class="single-slider">
                    <span>图形缩放比例</span>
                    <input type="range" min="50" max="300" value="220" class="control-slider" id="scaleSlider">
                    <span class="slider-value" id="scaleValue">220%</span>
                </div>
                <div class="single-slider">
                    <span>移动M、N点</span>
                    <input type="range" min="0" max="50" value="15" class="control-slider" id="mnSlider">
                    <span class="slider-value" id="mnValue">15%</span>
                </div>
                <div class="single-slider">
                    <span>显示答案与解析</span>
                    <input type="range" min="0" max="100" value="0" class="control-slider" id="ansSlider">
                    <span class="slider-value" id="ansValue">0%</span>
                </div>
                <div class="single-slider">
                    <span>标签字号大小</span>
                    <input type="range" min="10" max="50" value="30" class="control-slider" id="labelSizeSlider">
                    <span class="slider-value" id="labelSizeValue">30px</span>
                </div>
                <div class="single-slider">
                    <span>题目文字大小</span>
                    <input type="range" min="12" max="50" value="20" class="control-slider" id="titleSizeSlider">
                    <span class="slider-value" id="titleSizeValue">20px</span>
                </div>
                <div class="single-slider">
                    <span>画布高度</span>
                    <input type="range" min="300" max="600" value="400" class="control-slider" id="canvasHeightSlider">
                    <span class="slider-value" id="canvasHeightValue">400px</span>
                </div>
                <div class="single-slider">
                    <span>网格显示</span>
                    <input type="range" min="0" max="100" value="0" class="control-slider" id="gridSlider">
                    <span class="slider-value" id="gridValue">0%</span>
                </div>
                <div class="single-slider">
                    <span>线条粗细</span>
                    <input type="range" min="1" max="10" value="3" class="control-slider" id="lineWidthSlider">
                    <span class="slider-value" id="lineWidthValue">3px</span>
                </div>
                <div class="single-slider">
                    <span>点大小</span>
                    <input type="range" min="2" max="15" value="5" class="control-slider" id="pointSizeSlider">
                    <span class="slider-value" id="pointSizeValue">5px</span>
                </div>
                <div class="single-slider">
                    <span>动画速度</span>
                    <input type="range" min="1" max="10" value="5" class="control-slider" id="speedSlider">
                    <span class="slider-value" id="speedValue">5x</span>
                </div>
                <div style="text-align: center; margin-top: 10px;">
                    <button class="reset-btn" id="resetBtn">重置参数</button>
                </div>
            </div>
        </div>

        <div class="footer">制作时间：2026.1.20  作者：雷新风</div>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const scaleSlider = document.getElementById('scaleSlider');
        const mnSlider = document.getElementById('mnSlider'); 
        const ansSlider = document.getElementById('ansSlider');
        const labelSizeSlider = document.getElementById('labelSizeSlider');
        const titleSizeSlider = document.getElementById('titleSizeSlider');
        const canvasHeightSlider = document.getElementById('canvasHeightSlider');
        const gridSlider = document.getElementById('gridSlider');
        const lineWidthSlider = document.getElementById('lineWidthSlider');
        const pointSizeSlider = document.getElementById('pointSizeSlider');
        const speedSlider = document.getElementById('speedSlider');
        const autoBtn = document.getElementById('autoBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        const scaleValue = document.getElementById('scaleValue');
        const mnValue = document.getElementById('mnValue');
        const ansValue = document.getElementById('ansValue');
        const labelSizeValue = document.getElementById('labelSizeValue');
        const titleSizeValue = document.getElementById('titleSizeValue');
        const canvasHeightValue = document.getElementById('canvasHeightValue');
        const gridValue = document.getElementById('gridValue');
        const lineWidthValue = document.getElementById('lineWidthValue');
        const pointSizeValue = document.getElementById('pointSizeValue');
        const speedValue = document.getElementById('speedValue');
        
        const geomCondition = document.querySelector('.geom-condition');
        const h1Title = document.querySelector('h1');
        
        let pointRadius = 5; 
        const labelOffset = 10;
        const translateX = 30;
        const translateY = -110;
        let scaleRatio = 2.2, mnRatio = 0.15, ansRatio = 0;
        let labelSize = 30, titleSize = 20, canvasHeight = 400;
        let gridRatio = 0, lineWidth = 3, animationSpeed = 5;
        const shadowColor = 'rgba(255,105,180,0.45)';
        let canvasW, canvasH;
        let A,B,C,D,M,N,P;
        const AB_LEN = 6, AD_LEN = 8;
        
        // 自动运动相关变量
        let autoInterval = null;
        
        // 标签拖动相关变量
        let labelPositions = {}; // 存储标签的自定义位置
        let isDraggingLabel = false;
        let draggedLabel = null;
        let dragOffset = {x: 0, y: 0};
        
        // 图形拖动相关变量
        let isDraggingGraph = false;
        let lastMousePos = {x: 0, y: 0};

        function initCanvas() {
            canvasW = canvas.width = canvas.offsetWidth;
            canvasH = canvas.height = canvasHeight;
            canvas.style.height = canvasHeight + 'px';
            ctx.lineWidth = 3;
            initPoints();
            drawGraph();
        }

        function initPoints() {
            const baseScale = Math.min(canvasW/30, canvasH/22);
            const finalScale = baseScale * scaleRatio;

            // 计算AB边的垂直高度（这是图形的主要高度分量）
            const abHeight = Math.abs(AB_LEN * finalScale * Math.sin(120 * Math.PI/180));
            
            // 确保图形始终居中显示，没有固定偏移量
            const baseX = canvasW/2 - (AD_LEN * finalScale)/2;
            const baseY = canvasH/2 + (abHeight)/2;

            A = {x: baseX, y: baseY};          
            D = {x: baseX + AD_LEN*finalScale, y: baseY};
            const angleDAB = 120 * Math.PI/180;
            B = {
                x: A.x + AB_LEN*finalScale*Math.cos(angleDAB),
                y: A.y + AB_LEN*finalScale*Math.sin(angleDAB)
            };
            C = {x: B.x + (D.x - A.x), y: B.y + (D.y - A.y)};

            updateMN(finalScale);
            updateP();
        }

        function updateMN(finalScale) {
            const AM = AB_LEN * mnRatio;
            const angleDAB = 120 * Math.PI/180;
            M = {
                x: A.x + AM*finalScale*Math.cos(angleDAB),
                y: A.y + AM*finalScale*Math.sin(angleDAB)
            };
            N = {
                x: A.x + AM*finalScale, 
                y: A.y
            };
        }

        function updateP() {
            const dx = N.x - M.x;
            const dy = N.y - M.y;
            P = {
                x: M.x + dx*Math.cos(60*Math.PI/180) - dy*Math.sin(60*Math.PI/180),
                y: M.y + dx*Math.sin(60*Math.PI/180) + dy*Math.cos(60*Math.PI/180)
            };
        }

        function drawGraph() {
            ctx.clearRect(0, 0, canvasW, canvasH);
            const baseScale = Math.min(canvasW/30, canvasH/22);
            const finalScale = baseScale * scaleRatio;
            const AM = Math.min(AB_LEN * mnRatio, AB_LEN);
            const DN = AD_LEN - AM;

            // 绘制网格
            if (gridRatio > 0) {
                drawGrid();
            }

            // 保存当前状态，应用图形偏移
            ctx.save();
            ctx.translate(graphOffset.x, graphOffset.y);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = lineWidth;
            ctx.beginPath();
            ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.lineTo(C.x,C.y);ctx.lineTo(D.x,D.y);ctx.closePath();
            ctx.stroke();
            drawAngle(A, B, C, 24, '60°');

            updateMN(finalScale);
            drawPoint(A,'#ffff33');
            drawLabel('A', A, -labelOffset, -labelOffset);
            drawPoint(B,'#ffff33');
            drawLabel('B', B, -labelOffset, labelOffset);
            drawPoint(C,'#ffff33');
            drawLabel('C', C, labelOffset, labelOffset);
            drawPoint(D,'#ffff33');
            drawLabel('D', D, labelOffset, -labelOffset);
            drawPoint(M,'#ff4081');
            drawLabel('M', M, -labelOffset-5, 0);
            drawPoint(N,'#ff4081');
            drawLabel('N', N, 0, -labelOffset);
            ctx.strokeStyle = '#ff4081';
            ctx.beginPath();ctx.moveTo(M.x,M.y);ctx.lineTo(N.x,N.y);ctx.stroke();

            updateP();
            ctx.strokeStyle = '#4dd0e1';
            ctx.fillStyle = shadowColor;
            ctx.beginPath();ctx.moveTo(M.x,M.y);ctx.lineTo(N.x,N.y);ctx.lineTo(P.x,P.y);ctx.closePath();
            ctx.fill();ctx.stroke();
            drawPoint(P,'#4dd0e1');
            drawLabel('P', P, 0, labelOffset+5);

            if(ansRatio > 0) {
                ctx.globalAlpha = ansRatio;
                if(mnRatio > 0.48 || ansRatio > 0.5) {
                    ctx.strokeStyle = '#a5d6a7';
                    ctx.lineWidth = 4;
                    ctx.beginPath();ctx.moveTo(M.x,M.y);ctx.lineTo(N.x,N.y);ctx.lineTo(P.x,P.y);ctx.closePath();
                    ctx.stroke();
                    ctx.lineWidth = lineWidth;
                    drawLabel('△MNP面积最大', P, 15, 30, 'left','top');
                    drawLabel(`DN=${DN.toFixed(0)}`, {x:(D.x+N.x)/2,y:(D.y+N.y)/2}, 5, -15, 'center','bottom');
                }
                ctx.globalAlpha = 1;
            }

            // 恢复原始状态
            ctx.restore();
        }
        
        // 绘制网格
        function drawGrid() {
            ctx.save();
            ctx.globalAlpha = gridRatio;
            ctx.strokeStyle = 'rgba(100, 255, 218, 0.3)';
            ctx.lineWidth = 0.5;
            
            // 网格大小（像素）
            const gridSize = 20;
            
            // 绘制垂直线
            for (let x = 0; x < canvasW; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvasH);
                ctx.stroke();
            }
            
            // 绘制水平线
            for (let y = 0; y < canvasH; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvasW, y);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        function drawPoint(p,color){
            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.arc(p.x,p.y,pointRadius,0,Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.lineWidth = lineWidth;
        }

        function drawLabel(txt,p,ox,oy, align='center', baseline='middle'){
            ctx.save();
            ctx.fillStyle = '#fff';
            ctx.font = `italic ${labelSize}px Times New Roman`;
            ctx.textAlign = align;
            ctx.textBaseline = baseline;
            
            // 检查是否有自定义位置
            const pos = labelPositions[txt];
            if (pos) {
                // 使用自定义位置
                ctx.fillText(txt, p.x + pos.x, p.y + pos.y);
            } else {
                // 使用默认偏移
                ctx.fillText(txt, p.x + ox, p.y + oy);
            }
            ctx.restore();
        }
        
        // 检测鼠标是否点击在标签上
        function getLabelAtPosition(mouseX, mouseY) {
            // 定义所有标签及其位置
            const labels = [
                {name: 'A', point: A, offset: {x: -labelOffset, y: -labelOffset}},
                {name: 'B', point: B, offset: {x: -labelOffset, y: labelOffset}},
                {name: 'C', point: C, offset: {x: labelOffset, y: labelOffset}},
                {name: 'D', point: D, offset: {x: labelOffset, y: -labelOffset}},
                {name: 'M', point: M, offset: {x: -labelOffset-5, y: 0}},
                {name: 'N', point: N, offset: {x: 0, y: -labelOffset}},
                {name: 'P', point: P, offset: {x: 0, y: labelOffset+5}}
            ];
            
            for (const label of labels) {
                const pos = labelPositions[label.name] || label.offset;
                // 计算标签在画布上的实际位置（考虑图形偏移）
                const textX = label.point.x + pos.x + graphOffset.x;
                const textY = label.point.y + pos.y + graphOffset.y;
                
                ctx.font = `italic ${labelSize}px Times New Roman`;
                const metrics = ctx.measureText(label.name);
                const textWidth = metrics.width;
                const textHeight = labelSize;
                
                const left = textX - textWidth / 2;
                const right = textX + textWidth / 2;
                const top = textY - textHeight / 2;
                const bottom = textY + textHeight / 2;
                
                if (mouseX >= left && mouseX <= right && mouseY >= top && mouseY <= bottom) {
                    return label;
                }
            }
            return null;
        }

        function drawAngle(p1, center, p2, r, txt) {
            const ang1 = Math.atan2(p1.y - center.y, p1.x - center.x);
            const ang2 = Math.atan2(p2.y - center.y, p2.x - center.x);
            ctx.beginPath();
            ctx.arc(center.x, center.y, r, ang1, ang2);
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            drawLabel(txt, center, 38, -13); // 上移5单位，最终偏移-13
        }
        
        // 添加图形拖动和标签拖动的变量
        let graphOffset = {x: 0, y: 0};
        let initialGraphOffset = {x: 0, y: 0};
        
        // 鼠标事件处理（标签拖动和图形拖动）
        canvas.addEventListener('mousedown', function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const label = getLabelAtPosition(mouseX, mouseY);
            if (label) {
                // 点击在标签上，开始拖动标签
                isDraggingLabel = true;
                draggedLabel = label.name;
                const pos = labelPositions[label.name] || label.offset;
                dragOffset.x = mouseX - (label.point.x + pos.x);
                dragOffset.y = mouseY - (label.point.y + pos.y);
            } else {
                // 没有点击在标签上，开始拖动图形
                isDraggingGraph = true;
                lastMousePos = {x: mouseX, y: mouseY};
                initialGraphOffset = {x: graphOffset.x, y: graphOffset.y};
            }
        });
        
        canvas.addEventListener('mousemove', function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            if (isDraggingLabel && draggedLabel) {
                // 拖动标签
                // 定义所有标签
                const labels = [
                    {name: 'A', point: A, offset: {x: -labelOffset, y: -labelOffset}},
                    {name: 'B', point: B, offset: {x: -labelOffset, y: labelOffset}},
                    {name: 'C', point: C, offset: {x: labelOffset, y: labelOffset}},
                    {name: 'D', point: D, offset: {x: labelOffset, y: -labelOffset}},
                    {name: 'M', point: M, offset: {x: -labelOffset-5, y: 0}},
                    {name: 'N', point: N, offset: {x: 0, y: -labelOffset}},
                    {name: 'P', point: P, offset: {x: 0, y: labelOffset+5}}
                ];
                
                const label = labels.find(l => l.name === draggedLabel);
                if (label) {
                    // 更新标签位置
                    labelPositions[draggedLabel] = {
                        x: mouseX - label.point.x - dragOffset.x,
                        y: mouseY - label.point.y - dragOffset.y
                    };
                    drawGraph();
                }
            } else if (isDraggingGraph) {
                // 拖动图形
                const dx = mouseX - lastMousePos.x;
                const dy = mouseY - lastMousePos.y;
                
                // 更新图形偏移（将当前移动距离添加到当前偏移量上）
                graphOffset.x += dx;
                graphOffset.y += dy;
                
                // 重新绘制图形
                drawGraph();
                
                // 更新鼠标位置
                lastMousePos = {x: mouseX, y: mouseY};
            }
        });
        
        canvas.addEventListener('mouseup', function() {
            isDraggingLabel = false;
            draggedLabel = null;
            isDraggingGraph = false;
        });
        
        canvas.addEventListener('mouseleave', function() {
            isDraggingLabel = false;
            draggedLabel = null;
            isDraggingGraph = false;
        });

        // 初始化所有滑动条值
        labelSizeSlider.value = labelSize;
        titleSizeSlider.value = titleSize;
        canvasHeightSlider.value = canvasHeight;
        gridSlider.value = gridRatio * 100;
        lineWidthSlider.value = lineWidth;
        pointSizeSlider.value = pointRadius;
        speedSlider.value = animationSpeed;
        
        // 更新所有显示值
        labelSizeValue.textContent = labelSize;
        titleSizeValue.textContent = titleSize;
        canvasHeightValue.textContent = canvasHeight;
        gridValue.textContent = gridSlider.value;
        lineWidthValue.textContent = lineWidth;
        pointSizeValue.textContent = pointRadius;
        speedValue.textContent = animationSpeed;
        
        // 图形缩放滑动条
        scaleSlider.addEventListener('input',function(){
            scaleRatio = this.value / 10;
            scaleValue.innerText = scaleRatio.toFixed(1) + '×';
            initPoints();
            drawGraph();
        });
        
        // MN点运动滑动条
        mnSlider.addEventListener('input',function(){
            mnRatio = this.value / 100;
            mnValue.innerText = (AB_LEN * mnRatio).toFixed(1);
            initPoints();
            drawGraph();
        });
        
        // 答案显示滑动条
        ansSlider.addEventListener('input',function(){
            ansRatio = this.value / 100;
            ansValue.innerText = ansRatio >= 0.5 ? '是' : '否';
            initPoints();
            drawGraph();
        });
        
        // 标签大小滑动条
        labelSizeSlider.addEventListener('input', function() {
            labelSize = parseInt(this.value);
            labelSizeValue.textContent = labelSize;
            drawGraph();
        });
        
        // 标题大小滑动条
        titleSizeSlider.addEventListener('input', function() {
            titleSize = parseInt(this.value);
            titleSizeValue.textContent = titleSize;
            geomCondition.style.fontSize = titleSize + 'px';
        });
        
        // 画布高度滑动条
        canvasHeightSlider.addEventListener('input', function() {
            canvasHeight = parseInt(this.value);
            canvasHeightValue.textContent = canvasHeight;
            initCanvas();
        });
        
        // 网格显示滑动条
        gridSlider.addEventListener('input', function() {
            gridRatio = this.value / 100;
            gridValue.textContent = this.value;
            drawGraph();
        });
        
        // 线条宽度滑动条
        lineWidthSlider.addEventListener('input', function() {
            lineWidth = parseInt(this.value);
            lineWidthValue.textContent = lineWidth;
            drawGraph();
        });
        
        // 点大小滑动条
        pointSizeSlider.addEventListener('input', function() {
            pointRadius = parseInt(this.value);
            pointSizeValue.textContent = pointRadius;
            drawGraph();
        });
        
        // 动画速度滑动条
        speedSlider.addEventListener('input', function() {
            animationSpeed = parseInt(this.value);
            speedValue.textContent = animationSpeed;
        });
        
        // 自动运动按钮
        autoBtn.addEventListener('click', function() {
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                this.textContent = '自动运动';
            } else {
                let direction = 1;
                let step = animationSpeed / 100;
                
                autoInterval = setInterval(() => {
                    mnSlider.value = parseInt(mnSlider.value) + direction;
                    
                    if (parseInt(mnSlider.value) >= 100 || parseInt(mnSlider.value) <= 0) {
                        direction *= -1;
                    }
                    
                    mnRatio = mnSlider.value / 100;
                    mnValue.innerText = (AB_LEN * mnRatio).toFixed(1);
                    
                    // 只更新MN点的位置，不重新初始化所有点
                    const baseScale = Math.min(canvasW/30, canvasH/22);
                    const finalScale = baseScale * scaleRatio;
                    updateMN(finalScale);
                    updateP();
                    drawGraph();
                }, 100);
                
                this.textContent = '停止运动';
            }
        });
        
        // 重置按钮
        resetBtn.addEventListener('click', function() {
            // 重置所有参数
            scaleRatio = 2.2;
            mnRatio = 0.15;
            ansRatio = 0;
            labelSize = 30;
            titleSize = 20;
            canvasHeight = 400;
            gridRatio = 0;
            lineWidth = 3;
            pointRadius = 5;
            animationSpeed = 5;
            
            // 更新所有滑动条
            scaleSlider.value = scaleRatio * 10;
            mnSlider.value = mnRatio * 100;
            ansSlider.value = ansRatio * 100;
            labelSizeSlider.value = labelSize;
            titleSizeSlider.value = titleSize;
            canvasHeightSlider.value = canvasHeight;
            gridSlider.value = gridRatio * 100;
            lineWidthSlider.value = lineWidth;
            pointSizeSlider.value = pointRadius;
            speedSlider.value = animationSpeed;
            
            // 更新所有显示值
            scaleValue.innerText = scaleRatio.toFixed(1) + '×';
            mnValue.innerText = (AB_LEN * mnRatio).toFixed(1);
            ansValue.innerText = ansRatio >= 0.5 ? '是' : '否';
            labelSizeValue.textContent = labelSize;
            titleSizeValue.textContent = titleSize;
            canvasHeightValue.textContent = canvasHeight;
            gridValue.textContent = gridSlider.value;
            lineWidthValue.textContent = lineWidth;
            pointSizeValue.textContent = pointRadius;
            speedValue.textContent = animationSpeed;
            
            // 停止自动运动
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                autoBtn.textContent = '自动运动';
            }
            
            // 更新UI
            geomCondition.style.fontSize = titleSize + 'px';
            
            // 重新绘制
            initCanvas();
        });

        window.onload = initCanvas;
        window.addEventListener('resize', function(){initCanvas();});
    </script>
</body>
</html>
