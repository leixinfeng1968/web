            const parallelLine = {x1, y1, x2, y2, type: 'parallel', shapeType: 'line', parentLine: line, parentPoint: point, visible: true};
            shapes.lines.push(parallelLine);
            
            // 保存子对象引用到父对象
            if (!line.children) line.children = [];
            line.children.push(parallelLine);
            
            // 重置选中对象，确保后续工具操作不受影响
            selectedObjects = [];
            deleteButton.style.display = 'none';
            // 更新构造菜单项状态
            updateConstructMenuStatus();
            redrawCanvas();
        }

        // 构造线段
        function createSegment() {
            // 检查是否选中了两个点
            const selectedPoints = selectedObjects.filter(obj => obj.type === 'points');
            if (selectedPoints.length !== 2) {
                return alert('请先选中两个点');
            }
            saveHistory();
            const p1 = selectedPoints[0].shape;
            const p2 = selectedPoints[1].shape;
            
            // 创建线段
            const segment = {x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, p1: p1, p2: p2};
            
            // 检查两个点是否在同一条线上
            if (arePointsOnSameLine(p1, p2)) {
                segment.parentLine = p1.parentLine;
                // 保存线段到父对象
                if (!p1.parentLine.children) p1.parentLine.children = [];
                p1.parentLine.children.push(segment);
            }
            
            shapes.lines.push(segment);
            // 重置选中对象，确保后续工具操作不受影响
            selectedObjects = [];
            deleteButton.style.display = 'none';
            // 更新构造菜单项状态
            updateConstructMenuStatus();
            redrawCanvas();
        }

        // 构造射线
        function createRay() {
            // 检查是否选中了两个点
            const selectedPoints = selectedObjects.filter(obj => obj.type === 'points');
            if (selectedPoints.length !== 2) {
                return alert('请先选中两个点');
            }
            saveHistory();
            const p1 = selectedPoints[0].shape;
            const p2 = selectedPoints[1].shape;
            // 射线：从p1出发，经过p2，向p2方向无限延伸
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const length = Math.sqrt(dx * dx + dy * dy);
            const scale = 10000 / length; // 延伸10000像素，确保覆盖整个画布
            const ray = {x1: p1.x, y1: p1.y, x2: p1.x + dx * scale, y2: p1.y + dy * scale, p1: p1, p2: p2, shapeType: 'ray', visible: true};
            // 确保射线属性不会被意外修改
            Object.defineProperty(ray, 'shapeType', {
                value: 'ray',
                writable: true,
                enumerable: true,
                configurable: true
            });
            shapes.lines.push(ray);
            // 重置选中对象，确保后续工具操作不受影响
            selectedObjects = [];
            deleteButton.style.display = 'none';
            // 更新构造菜单项状态
            updateConstructMenuStatus();
            redrawCanvas();
        }
        
        // 构造直线
        function createLine() {
            // 检查是否选中了两个点
            const selectedPoints = selectedObjects.filter(obj => obj.type === 'points');
            if (selectedPoints.length !== 2) {
                return alert('请先选中两个点');
            }
            saveHistory();
            const p1 = selectedPoints[0].shape;
            const p2 = selectedPoints[1].shape;
            // 直线：经过p1和p2，向两个方向无限延伸
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const length = Math.sqrt(dx * dx + dy * dy);
            const scale = 10000 / length; // 延伸10000像素，确保覆盖整个画布
            const line = {
                x1: p1.x - dx * scale, 
                y1: p1.y - dy * scale, 
                x2: p2.x + dx * scale, 
                y2: p2.y + dy * scale,
                p1: p1, 
                p2: p2,
                shapeType: 'line',
                visible: true
            };
            // 确保直线属性不会被意外修改
            Object.defineProperty(line, 'shapeType', {
                value: 'line',
                writable: true,
                enumerable: true,
                configurable: true
            });
            shapes.lines.push(line);
            // 重置选中对象，确保后续工具操作不受影响
            selectedObjects = [];
            deleteButton.style.display = 'none';
            // 更新构造菜单项状态
            updateConstructMenuStatus();
            redrawCanvas();
        }
        
        // 构造线段
        function createSegment() {
            // 检查是否选中了两个点
            const selectedPoints = selectedObjects.filter(obj => obj.type === 'points');
            if (selectedPoints.length !== 2) {
                return alert('请先选中两个点');
            }
            saveHistory();
            const p1 = selectedPoints[0].shape;
            const p2 = selectedPoints[1].shape;
            
            // 创建线段
            const segment = {x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, p1: p1, p2: p2, shapeType: 'segment', visible: true};
            
            // 确保线段属性不会被意外修改
            Object.defineProperty(segment, 'shapeType', {
                value: 'segment',
                writable: true,
                enumerable: true,
                configurable: true
            });
            
            // 检查两个点是否在同一条线上
            if (arePointsOnSameLine(p1, p2)) {
                segment.parentLine = p1.parentLine;
                // 保存线段到父对象
                if (!p1.parentLine.children) p1.parentLine.children = [];
                p1.parentLine.children.push(segment);
            }
            
            shapes.lines.push(segment);
            // 重置选中对象，确保后续工具操作不受影响
            selectedObjects = [];
            deleteButton.style.display = 'none';
            // 更新构造菜单项状态
            updateConstructMenuStatus();
            redrawCanvas();
        }
        


        // 重绘画布
        function redrawCanvas() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            if(showGridFlag) drawGrid();
            drawShapes('lines');drawShapes('dashes');drawShapes('rectangles');drawShapes('circles');
            drawShapes('rightTriangles');drawShapes('isoTriangles');drawShapes('penPaths');
            drawShapes('points');drawShapes('labels');drawShapes('measures');
            if(showCoordFlag) drawCoord();
            selectedObjects.forEach(({type, shape}) => drawSelectionBorder(type, shape));
        }
        // 隐藏选中对象
        function hideSelectedObjects() {
            if (selectedObjects.length === 0) return;
            selectedObjects.forEach(({shape}) => {
                shape.visible = false;
            });
            redrawCanvas();
        }
        
        // 显示所有对象
        function showAllObjects() {
            Object.keys(shapes).forEach(type => {
                shapes[type].forEach(shape => {
                    shape.visible = true;
                });
            });
            redrawCanvas();
        }
        
        function drawShapes(type) {
            shapes[type].forEach(shape => {
                // 只绘制可见的对象
                if (shape.visible === false) return;
                
                ctx.save(); ctx.strokeStyle='#000'; ctx.fillStyle='#000';
                
                // 检查是否是鼠标下的线，并且当前是点工具
                const isMouseOver = mouseOverLine && currentTool === 'point' && mouseOverLine.shape === shape && mouseOverLine.type === type;
                if (isMouseOver) {
                    // 高亮显示：红色，粗线条
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = 3;
                }
                
                switch(type) {
                    case 'points': ctx.beginPath();ctx.arc(shape.x,shape.y,3,0,2*Math.PI);ctx.fill();if(showLabelFlag){ctx.font='italic 24px Times New Roman';ctx.fillText(shape.label,shape.labelX,shape.labelY);}break;
                    case 'lines': 
                        // 优先信任shapeType属性，只有在没有指定时才自动检测
                        let lineType = shape.shapeType || 'segment';
                        
                        // 检查是否是正在绘制中的直线
                        const isDrawingLine = isDrawing && currentTool === 'line' && currentShape === shape;
                        
                        // 如果是正在绘制中的直线，强制将其视为直线类型
                        if (isDrawingLine) {
                            lineType = 'line';
                        } else if (!shape.shapeType) {
                            // 只有在没有指定shapeType时，才检查线的实际属性
                            // 对于射线和直线，x1,y1到x2,y2的距离远大于p1到p2的距离
                            if (shape.p1 && shape.p2) {
                                // 计算原始点之间的距离
                                const originalDist = Math.sqrt(
                                    Math.pow(shape.p2.x - shape.p1.x, 2) + 
                                    Math.pow(shape.p2.y - shape.p1.y, 2)
                                );
                                
                                // 计算当前线的长度
                                const currentDist = Math.sqrt(
                                    Math.pow(shape.x2 - shape.x1, 2) + 
                                    Math.pow(shape.y2 - shape.y1, 2)
                                );
                                
                                // 如果当前线的长度远大于原始点之间的距离，说明是射线或直线
                                if (currentDist > originalDist * 2) {
                                    // 检查是否为射线（从p1出发，经过p2）
                                    const isRay = Math.abs(
                                        (shape.x2 - shape.x1) * (shape.p2.y - shape.p1.y) - 
                                        (shape.y2 - shape.y1) * (shape.p2.x - shape.p1.x)
                                    ) < 1e-6;
                                    
                                    if (isRay) {
                                        lineType = 'ray';
                                    } else {
                                        lineType = 'line';
                                    }
                                }
                            }
                        }
                        
                        // 对于射线和直线，确保它们始终延伸到画布边缘
                        let x1 = shape.x1;
                        let y1 = shape.y1;
                        let x2 = shape.x2;
                        let y2 = shape.y2;
                        
                        // 计算线的方向向量
                        const dx = x2 - x1;
                        const dy = y2 - y1;
                        let nx, ny;
                        
                        // 获取原始点作为参考
                        const originalP1 = shape.p1;
                        const originalP2 = shape.p2;
                        
                        // 处理正在绘制中的直线
                        if (isDrawingLine) {
                            // 对于正在绘制中的直线，使用当前鼠标位置与起点的向量作为方向
                            const length = Math.sqrt(dx * dx + dy * dy);
                            nx = dx / length;
                            ny = dy / length;
                            
                            // 向两个方向无限延伸
                            const scale = 10000;
                            x1 = shape.x1 - nx * scale;
                            y1 = shape.y1 - ny * scale;
                            x2 = shape.x1 + nx * scale;
                            y2 = shape.y1 + ny * scale;
                        } else if (lineType === 'ray' && originalP1) {
                            // 射线：从p1出发，经过p2，向p2方向无限延伸
                            const length = Math.sqrt(dx * dx + dy * dy);
                            nx = dx / length;
                            ny = dy / length;
                            
                            const scale = 10000;
                            x1 = originalP1.x;
                            y1 = originalP1.y;
                            x2 = originalP1.x + nx * scale;
                            y2 = originalP1.y + ny * scale;
                        } else if (lineType === 'line') {
                            // 处理普通直线（包括垂线和平行线）
                            const length = Math.sqrt(dx * dx + dy * dy);
                            
                            // 如果长度为0，说明是一个点，直接返回
                            if (length === 0) {
                                ctx.beginPath();
                                ctx.moveTo(x1, y1);
                                ctx.lineTo(x2, y2);
                                ctx.stroke();
                                return;
                            }
                            
                            // 计算方向向量
                            nx = dx / length;
                            ny = dy / length;
                            
                            // 向两个方向无限延伸
                            const scale = 10000;
                            
                            if (originalP1 && originalP2) {
                                // 对于有原始点的直线，使用原始点作为参考
                                const originalDx = originalP2.x - originalP1.x;
                                const originalDy = originalP2.y - originalP1.y;
                                const originalLength = Math.sqrt(originalDx * originalDx + originalDy * originalDy);
                                const originalNx = originalDx / originalLength;
                                const originalNy = originalDy / originalLength;
                                
                                x1 = originalP1.x - originalNx * scale;
                                y1 = originalP1.y - originalNy * scale;
                                x2 = originalP1.x + originalNx * scale;
                                y2 = originalP1.y + originalNy * scale;
                            } else {
                                // 对于垂线和平行线等没有原始点的直线，使用当前方向向量延伸
                                x1 = shape.x1 - nx * scale;
                                y1 = shape.y1 - ny * scale;
                                x2 = shape.x1 + nx * scale;
                                y2 = shape.y1 + ny * scale;
                            }
                        }
                        
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.stroke();
                        break;
                    case 'dashes': 
                        if (isMouseOver) {
                            ctx.setLineDash([]); // 高亮时显示为实线
                        } else {
                            ctx.setLineDash([5,3]);
                        }
                        ctx.beginPath();ctx.moveTo(shape.x1,shape.y1);ctx.lineTo(shape.x2,shape.y2);ctx.stroke();ctx.setLineDash([]);break;
                    case 'rectangles': 
                        // 确保绘制的矩形位置和大小正确，处理width和height为负数的情况
                        const rectX = Math.min(shape.x, shape.x + shape.width);
                        const rectY = Math.min(shape.y, shape.y + shape.height);
                        const rectWidth = Math.abs(shape.width);
                        const rectHeight = Math.abs(shape.height);
                        ctx.beginPath();ctx.rect(rectX, rectY, rectWidth, rectHeight);ctx.stroke();break;
                    case 'circles': 
                        // 确保radius为正数
                        const radius = Math.abs(shape.radius);
                        ctx.beginPath();ctx.arc(shape.x, shape.y, radius, 0, 2*Math.PI);ctx.stroke();break;
                    case 'rightTriangles':case 'isoTriangles':ctx.beginPath();ctx.moveTo(shape.x1,shape.y1);ctx.lineTo(shape.x2,shape.y2);ctx.lineTo(shape.x3,shape.y3);ctx.closePath();ctx.stroke();break;
                    case 'penPaths':ctx.beginPath();shape.points.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();break;
                    case 'labels':if(showLabelFlag){ctx.font=`${shape.fontSize}px 微软雅黑`;ctx.fillText(shape.content,shape.x,shape.y);}break;
                    case 'measures':ctx.font=`${shape.fontSize}px 微软雅黑`;ctx.fillStyle='#e63946';ctx.fillText(shape.content,shape.x,shape.y);break;
                }
                ctx.restore();
            });
        }

        // 网格+坐标
        function drawGrid() {
            ctx.save();ctx.strokeStyle='#eee';ctx.lineWidth=1;
            const step=30;
            for(let x=0;x<canvas.width;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
            for(let y=0;y<canvas.height;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
            ctx.restore();
        }
        function drawCoord() {
            ctx.save();ctx.fillStyle='#999';ctx.font='12px 微软雅黑';
            const step=30;
            for(let x=step;x<canvas.width;x+=step) ctx.fillText(x-step,x,12);
            for(let y=step;y<canvas.height;y+=step) ctx.fillText(y-step,0,y);
            ctx.restore();
        }

        // 保存+导出
        function saveAsJson() {
            const blob=new Blob([JSON.stringify(shapes)],{type:'application/json'});
            const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='几何图形.json';a.click();
        }
        function exportAsImage() {
            const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='几何图形.png';a.click();
        }
    </script>
</body>
